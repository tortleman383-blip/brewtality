<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewtality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#120F17;
    --panel:#1C1822;
    --panel2:#262030;
    --line:#3A3244;
    --text:#F2ECE4;
    --muted:#A69CB0;
    --amber:#FFB547;
    --volt:#8FD3FF;
    --yell:#FFE14D;
    --toast:#FF5A1F;
    --rot:#C8F25A;
    --display:"Anton", Impact, "Haettenschweiler", "Arial Narrow Bold", sans-serif;
    --ui:"Barlow Condensed", "Arial Narrow", sans-serif;
    --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --outline: 3px 0 0 #000, -3px 0 0 #000, 0 3px 0 #000, 0 -3px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:#000;color:var(--text);font:15px/1.45 var(--body)}
  #app{height:100%}
  #stage{position:relative;height:100%;min-height:340px;overflow:hidden;background:#0B090E;user-select:none;-webkit-user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #stage.freeze #c{filter:saturate(1.7) contrast(1.18) brightness(1.05)}
  kbd{display:inline-block;min-width:1.1em;padding:1px 6px;margin-right:7px;font:700 .72em/1.35 var(--ui);letter-spacing:.06em;color:#000;background:#fff;text-align:center;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.6);vertical-align:.14em}

  /* letterbox (slow-mo and menus) + sling cam tag */
  .bar{position:absolute;left:0;right:0;height:11%;background:#000;transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:3}
  .bar.t{top:0;transform:translateY(-100%)} .bar.b{bottom:0;transform:translateY(100%)}
  .cine .bar,.menu-on .bar{transform:none}
  #tag{position:absolute;top:calc(11% + 12px);left:14px;font:700 13px var(--ui);letter-spacing:.18em;color:#fff;display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .2s;z-index:4}
  #tag i{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:blink 1s steps(2) infinite}
  .cine #tag{opacity:1}
  @keyframes blink{50%{opacity:.15}}

  /* hud: icons and numbers, nothing to read */
  #cross{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);transition:opacity .2s}
  .cine #cross,.cine .touch,.cine #prompt,.cine #satchel,.cine #tool,.cine #notices,.cine #map,.cine #loot,.cine .ib,.cine #bossbar{opacity:0;pointer-events:none}
  .menu-on #cross,.menu-on #prompt,.menu-on #loot,.menu-on #notices,.menu-on .ib,.menu-on .touch{opacity:0;pointer-events:none}
  .title-on #hearts,.title-on #score,.title-on #coins,.title-on #feed,.title-on #map,.title-on #cards,.title-on #tool,.title-on #cross,.title-on #bossbar,.title-on #labels,.title-on #loot,.title-on #notices,.title-on #callouts{opacity:0}
  #prompt{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font:400 19px/1 var(--display);letter-spacing:.07em;white-space:nowrap;text-shadow:var(--outline)}
  #prompt .pbar{width:92px;height:4px;background:rgba(255,255,255,.18);overflow:hidden}
  #prompt .pbar i{display:block;height:100%;width:0;background:var(--yell)}
  #prompt.locked{opacity:.5}
  #score{position:absolute;top:12px;right:14px;z-index:4}
  #score b{display:block;font:400 30px/1 var(--display);letter-spacing:.02em;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
  .cine #score{top:calc(11% + 10px)}
  #coins{position:absolute;top:48px;right:14px;z-index:4;display:flex;align-items:center;gap:7px;font:400 21px/1 var(--display);letter-spacing:.03em;color:#FFE38A;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
  #coins.bump{animation:cbump .3s ease-out}
  @keyframes cbump{40%{transform:scale(1.3)}}
  .cine #coins{top:calc(11% + 46px)}
  .coin{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF4B0,#FFD23A 45%,#A87A0A);box-shadow:0 0 0 2px #000;flex:none}
  .ptag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;background:#000;padding:4px 9px 3px;font:400 17px/1 var(--display);letter-spacing:.04em;color:#FFE38A;white-space:nowrap;will-change:transform;transform:skewX(-8deg)}
  .ptag.poor{color:#FF6A4D}
  .owned{display:flex;gap:6px;flex-wrap:wrap}
  .owned span{width:40px;height:40px;display:grid;place-items:center;background:#000;border-left:3px solid currentColor}
  .owned svg{width:24px;height:24px}
  #prompt small{font:700 12px/1 var(--ui);letter-spacing:.16em;color:#E8E0D4;text-shadow:0 2px 0 #000}
  #prompt .coin{margin:0 4px 0 2px;vertical-align:-.06em}
  #feed{position:absolute;top:84px;right:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:4}
  .cine #feed{top:calc(11% + 82px)}
  .kf{background:rgba(0,0,0,.78);padding:3px 9px;font:600 15px var(--ui);display:flex;gap:7px;align-items:center;animation:kfin .25s ease-out}
  .kf svg{width:18px;height:18px;color:var(--amber)}
  .kf .you{color:var(--volt)} .kf .how{font:400 15px var(--display);color:var(--yell);letter-spacing:.03em}
  @keyframes kfin{from{transform:translateX(30px);opacity:0}}
  /* short notices: a black slab, a few words, gone in two seconds */
  #notices{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:4;transition:opacity .2s}
  .nt{background:#000;color:#fff;font:400 18px/1 var(--display);letter-spacing:.08em;padding:7px 14px 6px;border-left:5px solid var(--yell);transform:skewX(-10deg);white-space:nowrap;animation:ntin .25s cubic-bezier(.2,.9,.2,1)}
  .nt > span{display:inline-block;transform:skewX(10deg)}
  .nt.bad{border-color:var(--toast)} .nt.good{border-color:var(--rot)}
  .nt em{font:700 12px var(--ui);font-style:normal;letter-spacing:.16em;color:var(--muted);margin-left:9px;vertical-align:2px}
  .nt kbd{margin:0 0 0 9px}
  .nt.out{animation:ntout .3s ease-in forwards}
  @keyframes ntin{from{transform:skewX(-10deg) translateY(10px);opacity:0}}
  @keyframes ntout{to{transform:skewX(-10deg) translateY(6px);opacity:0}}
  /* loot: an icon and a +1, floating up from the ladle */
  #loot{position:absolute;left:16px;bottom:84px;display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none;z-index:4}
  .lt{display:flex;align-items:center;gap:6px;font:400 20px/1 var(--display);letter-spacing:.04em;color:#fff;text-shadow:var(--outline);animation:ltin .3s cubic-bezier(.2,.9,.2,1) both}
  .lt svg{width:24px;height:24px;display:block;filter:drop-shadow(0 2px 0 #000)}
  .lt.rot{color:var(--rot)}
  .lt.out{animation:ltout .4s ease-in forwards}
  @keyframes ltin{from{transform:translateX(-24px) scale(1.4);opacity:0}}
  @keyframes ltout{to{transform:translateY(-14px);opacity:0}}
  .hpop{position:absolute;left:50%;top:40px;font:400 20px var(--display);color:#7CFF8A;text-shadow:var(--outline);animation:hpop 1.2s ease-out forwards;pointer-events:none}
  @keyframes hpop{0%{transform:translate(-50%,6px);opacity:0}20%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
  /* icon buttons, only when there's no locked mouse to use the keys with */
  .ib{position:absolute;top:12px;width:40px;height:40px;display:grid;place-items:center;padding:0;background:#000;border:0;color:#fff;cursor:pointer;z-index:4;transform:skewX(-8deg)}
  .ib svg{width:20px;height:20px;transform:skewX(8deg)}
  .ib:hover,.ib:focus-visible{background:var(--yell);color:#000;outline:none}
  #menuBtn{left:14px} #invBtn{left:58px}
  #tool{position:absolute;right:14px;bottom:14px;background:#000;padding:7px 11px;display:flex;align-items:center;gap:9px;transition:opacity .2s;transform:skewX(-8deg)}
  #tool > *{transform:skewX(8deg)}
  #tool svg{width:22px;height:22px;display:block}
  #tool kbd{margin:0}
  #tool .tank{width:64px;height:6px;background:#2A2430;overflow:hidden}
  #tool .tank i{display:block;height:100%;width:0;background:var(--volt)}
  .touch{position:absolute;z-index:4;border:3px solid var(--yell);color:#fff;font:400 16px/1 var(--display);letter-spacing:.04em;background:rgba(0,0,0,.82);cursor:pointer;touch-action:none}
  .touch:active{background:var(--yell);color:#000}
  #slingBtn{right:16px;bottom:62px;width:96px;height:96px;border-radius:50%}
  #actBtn{right:124px;bottom:72px;width:76px;height:76px;border-radius:50%;font-size:14px}
  #swapBtn{right:24px;bottom:172px;padding:8px 12px;font-size:14px}
  #hagBtn{right:120px;bottom:166px;padding:8px 12px;font-size:14px}
  #bonkBtn{right:212px;bottom:76px;width:68px;height:68px;border-radius:50%;font-size:15px}
  #prompt .hg{font-style:normal;color:var(--yell);margin-left:14px}
  #prompt .hg kbd{margin-right:5px}
  /* boss health: one bar along the bottom, TBOI style */
  #bossbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,56%);z-index:4;pointer-events:none;transition:opacity .2s}
  #bossbar b{display:block;font:400 16px/1 var(--display);letter-spacing:.12em;color:#FF6A4D;text-shadow:var(--outline);margin-bottom:6px;text-align:center}
  #bossbar .bb{height:10px;background:#000;border:2px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.14);transform:skewX(-12deg)}
  #bossbar .bb i{display:block;height:100%;width:100%;background:linear-gradient(#FF6A4D,#C8180A);transition:width .25s}

  /* satchel strip + pot cards */
  #satchel{position:absolute;left:14px;bottom:122px;display:flex;gap:4px;z-index:4;transition:opacity .2s}
  .sk{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(10,8,13,.72);padding:4px 5px 3px;min-width:30px}
  .sk svg{width:18px;height:18px;color:var(--c)}
  .sk b{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums}
  .sk .off{position:absolute;top:-7px;right:-5px;font:700 10px/1 var(--ui);background:var(--rot);color:#000;padding:2px 4px}
  .sk.none{opacity:.35}
  #cards{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;transform-origin:left bottom;transition:transform .3s cubic-bezier(.2,.8,.2,1),bottom .3s;z-index:4}
  .cine #cards{bottom:calc(11% + 16px);transform:scale(1.22)}
  .card{--c:#fff;width:54px;height:54px;box-sizing:border-box;background:#000;border:2px solid #2E2834;display:grid;place-items:center;position:relative;transition:transform .14s,border-color .14s,box-shadow .14s,opacity .3s}
  .card svg{width:28px;height:28px;color:var(--c)}
  .card .w{position:absolute;left:50%;top:-30px;transform:translateX(-50%) scale(.6);opacity:0;font:400 19px var(--display);color:#fff;text-shadow:var(--outline);white-space:nowrap;transition:transform .15s cubic-bezier(.3,1.8,.5,1),opacity .15s}
  .card.fire{transform:translateY(-8px) scale(1.14);border-color:var(--c);box-shadow:0 0 22px var(--c),inset 0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
  .card.fire .w,.card.done .w{opacity:1;transform:translateX(-50%) scale(1)}
  .card.done{opacity:.6}
  .card.t2 .w{color:var(--yell)} .card.t3 .w{color:var(--toast)}
  .card.off{background:#141A0C;border-color:#56702A}
  .card.off::after{content:"";position:absolute;top:-5px;right:-5px;width:9px;height:9px;background:var(--rot);border:2px solid #000}
  .card.boil{border-style:dashed}
  .card .q{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:400 26px var(--display);color:var(--rot);background:#11160B;text-shadow:2px 0 #FF2E6E,-2px 0 #00E5FF}
  .card.glitch .q{display:flex;animation:glitch .09s steps(2) infinite}
  .card.glitch{border-color:var(--rot);box-shadow:0 0 22px var(--rot);transform:translateY(-8px) scale(1.14)}
  .card.glitch .w{opacity:0}
  .card.rotw .w{color:var(--rot)}
  @keyframes glitch{0%{clip-path:inset(0 0 55% 0);transform:translateX(-3px)}50%{clip-path:inset(40% 0 0 0);transform:translateX(3px)}100%{clip-path:inset(10% 0 20% 0);transform:none}}
  .potg{width:46px;height:46px;margin-left:8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
  .potg svg{width:100%;height:100%;display:block}
  .spare{display:flex;align-items:center;gap:3px;margin-left:10px;padding:4px 6px;background:rgba(0,0,0,.7);opacity:.8}
  .spare i{display:block;width:18px;height:18px}
  .spare i svg{width:100%;height:100%}
  .spare kbd{margin:0 0 0 4px}
  #cards.swap{animation:cswap .3s ease-out}
  @keyframes cswap{40%{transform:translateY(6px) scale(.94);opacity:.5}}
  .link{width:10px;height:3px;background:#2E2834;transition:background .15s,box-shadow .15s,height .15s}
  .link.on{background:var(--volt);height:5px;box-shadow:0 0 12px var(--volt)}

  /* callouts */
  .co{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);color:#fff;text-shadow:var(--outline);will-change:transform,opacity}
  .co.c1{font-size:clamp(30px,4.2vw,50px);text-transform:lowercase;animation:co1 1.15s ease-out forwards}
  @keyframes co1{0%{transform:translate(-50%,-50%) scale(.4) rotate(-8deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.18) rotate(-4deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(-4deg);opacity:0}}
  /* the flavour rail: callouts land on the right, and a repeat bumps a counter instead of stacking up */
  #flav{position:absolute;right:16px;top:max(30%,220px);display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:48%}
  .cine #flav{top:max(36%,calc(11% + 214px))}
  #rail{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .rl{position:relative;font-family:var(--display);line-height:1.02;color:#fff;text-shadow:var(--outline);white-space:nowrap;transform-origin:100% 50%;animation:rlin .32s cubic-bezier(.2,.9,.2,1) both}
  .rl .w{display:inline-block;transform:rotate(-3deg)}
  .rl.t1{font-size:clamp(22px,2.3vw,30px);text-transform:lowercase}
  .rl.t2{font-size:clamp(30px,3.4vw,46px);color:var(--yell);letter-spacing:.02em}
  .rl.t3{font-size:clamp(40px,5.2vw,74px);margin:.04em 0;animation:rlin3 .5s cubic-bezier(.2,.9,.2,1) both}
  .rl.rot{color:var(--rot)}
  .rl .x{display:none;font-size:.56em;color:#fff;margin-left:.22em;vertical-align:.3em}
  .rl.multi .x{display:inline-block}
  .rl small{display:block;font:700 clamp(10px,1.1vw,13px) var(--ui);letter-spacing:.2em;color:#fff;text-align:right;margin-top:2px}
  .rl small:empty{display:none}
  .rl.t3 .w{position:relative;text-shadow:none}
  .rl.t3 .lyr{position:absolute;inset:0}
  .rl.t3 .stk{color:#000;-webkit-text-stroke:.12em #000}
  .rl.t3 .ab1{color:#00E5FF;transform:translate(-.04em,.01em);mix-blend-mode:screen;opacity:.85}
  .rl.t3 .ab2{color:#FF2E6E;transform:translate(.04em,-.01em);mix-blend-mode:screen;opacity:.85}
  .rl.t3 .fill{position:relative;display:inline-block;background:linear-gradient(180deg,#FFF8B0 0%,#FFD23A 38%,#FF7A1F 64%,#C8180A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rl.bump .x,.xp.bump span{animation:rlbump .35s ease-out}
  .rl.bump .w{animation:rlbumpw .35s ease-out}
  .rl.out,.xp.out{animation:rlout .35s ease-in forwards}
  @keyframes rlin{0%{transform:translateX(70px) scale(1.5);opacity:0}55%{transform:translateX(-6px) scale(.97);opacity:1}100%{transform:none;opacity:1}}
  @keyframes rlin3{0%{transform:translateX(40px) scale(2.6) rotate(-10deg);opacity:0}35%{transform:scale(.92) rotate(-2deg);opacity:1}60%{transform:scale(1.05)}100%{transform:none;opacity:1}}
  @keyframes rlbump{0%{transform:scale(1.8)}100%{transform:scale(1)}}
  @keyframes rlbumpw{0%{transform:rotate(-3deg) scale(1.14)}100%{transform:rotate(-3deg) scale(1)}}
  @keyframes rlout{to{transform:translateX(60px);opacity:0}}
  .stamp{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) rotate(8deg);font:400 clamp(16px,2.2vw,24px) var(--display);letter-spacing:.12em;color:#fff;background:#E5243B;border:3px solid #000;padding:4px 12px;box-shadow:0 4px 0 #000;animation:stamp 2s ease-out forwards;white-space:nowrap}
  @keyframes stamp{0%{transform:translate(-50%,-50%) rotate(8deg) scale(3);opacity:0}10%{transform:translate(-50%,-50%) rotate(8deg) scale(1);opacity:1}85%{opacity:1}100%{opacity:0}}
  #xp{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-top:4px}
  .xp{font:400 22px var(--display);color:var(--yell);text-shadow:var(--outline);letter-spacing:.03em;white-space:nowrap;transform-origin:100% 50%;animation:rlin .3s cubic-bezier(.2,.9,.2,1) both}
  .xp span{display:inline-block}
  .xp em{font-style:normal;color:#fff;font-size:.75em;margin-left:6px}
  .hm{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;animation:hm .38s ease-out forwards}
  @keyframes hm{0%{transform:scale(1.5)}30%{transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}

  /* creature labels */
  .lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
  .pips{display:flex;gap:2px}
  .pip{width:7px;height:7px;background:#F0524A;border:1.5px solid #000;border-radius:1px}
  .pip.e{background:#2A2430}
  .chips{display:flex;gap:2px}
  .chip{font:700 10px/1 var(--ui);letter-spacing:.1em;padding:2px 4px;border:1.5px solid #000;text-transform:uppercase;color:#000}
  .chip.wet{background:#8FC8F0}.chip.float{background:#F4D35E}.chip.glow{background:#5FF2D6}.chip.glass{background:#E8FBFF}.chip.daze{background:#FFB547}
  .lbl .arrow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--volt);filter:drop-shadow(0 0 4px var(--volt));display:none}
  .lbl.tgt .arrow{display:block;animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-4px)}}
  .banner{position:absolute;left:0;top:24%;display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none;animation:bnr 2.3s cubic-bezier(.2,.9,.2,1) forwards}
  .banner b{display:block;background:#000;color:#fff;font:400 clamp(30px,4.6vw,54px)/1 var(--display);letter-spacing:.05em;padding:9px 28px 8px 30px;margin-left:-10px;transform:skewX(-12deg);border-right:6px solid var(--yell);white-space:nowrap}
  .banner b span{display:inline-block;transform:skewX(12deg)}
  .banner.boss b{color:#FF6A4D;border-color:var(--toast)}
  .banner small{background:var(--yell);color:#000;font:700 13px/1 var(--ui);letter-spacing:.22em;padding:5px 12px 4px;margin-left:8px;transform:skewX(-12deg)}
  @keyframes bnr{0%{transform:translateX(-105%)}12%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(-30px);opacity:0}}
  #map{position:absolute;top:12px;left:14px;z-index:4;transition:opacity .2s,top .2s;pointer-events:none}
  .ptr #map{top:62px}
  #map .fl{font:400 15px/1 var(--display);letter-spacing:.07em;color:#fff;margin-bottom:7px;text-shadow:var(--outline)}
  #map .fl span{color:var(--muted)}
  #map .grid{position:relative}
  .marrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid #E5243B;filter:drop-shadow(0 0 2px #000);transform:translate(-50%,-50%)}
  #map .mn{margin-left:8px;color:var(--text);letter-spacing:.06em}
  .mc{position:absolute;width:24px;height:18px;box-sizing:border-box;background:#2A2430;border:1.5px solid #5A5064;display:flex;align-items:center;justify-content:center}
  .mc.unk{background:rgba(20,16,24,.6);border-style:dashed}
  .mc.cur{background:#F2ECE4;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.55)}
  .ml{position:absolute;background:#5A5064}
  .ic-chest{width:6px;height:6px;background:#FFD23A;transform:rotate(45deg)}
  .ic-garden{width:6px;height:6px;border-radius:50%;background:#5FF2D6}

}

    tr.pts.forEach((p, i) => { arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; });

    previewRing.visible = true; previewRing.position.set(tr.point.x, 0.03, tr.point.z);
    predicted = targetsAt(tr.point, tr.hitE);
  } else { previewDots.visible = false; previewRing.visible = false; }
  enemies.forEach(e => { e.tgt = predicted.includes(e); });

  // fx

  for (const f of cur) if (f.update(sdt, rdt) !== false) fx.push(f);
  for (const f of flames) { const k = 0.85 + Math.sin(T * 13 + f.ph) * 0.08 + Math.sin(T * 29 + f.ph * 2) * 0.06; f.fl.scale.set(1, k, 1); f.core.scale.set(1, k * 1.1, 1); f.L.intensity = 1.35 * k; }

  const eye = tmpV.set(player.pos.x, (player.down ? 0.45 : 1.6) + player.y + Math.sin(player.bob) * 0.035, player.pos.z);
