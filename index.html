<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewtality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=VT323&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#120F17;
    --panel:#1C1822;
    --panel2:#262030;
    --line:#3A3244;
    --text:#F2ECE4;
    --muted:#A69CB0;
    --amber:#FFB547;
    --volt:#8FD3FF;
    --yell:#FFE14D;
    --toast:#FF5A1F;
    --rot:#C8F25A;
    --display:"Anton", Impact, "Haettenschweiler", "Arial Narrow Bold", sans-serif;
    --ui:"Barlow Condensed", "Arial Narrow", sans-serif;
    --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --outline: 3px 0 0 #000, -3px 0 0 #000, 0 3px 0 #000, 0 -3px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:#000;color:var(--text);font:15px/1.45 var(--body)}
  #app{height:100%}
  #stage{position:relative;height:100%;min-height:340px;overflow:hidden;background:#0B090E;user-select:none;-webkit-user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #stage.freeze #c{filter:saturate(1.7) contrast(1.18) brightness(1.05)}
  kbd{display:inline-block;min-width:1.1em;padding:1px 6px;margin-right:7px;font:700 .72em/1.35 var(--ui);letter-spacing:.06em;color:#000;background:#fff;text-align:center;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.6);vertical-align:.14em}

  /* letterbox (slow-mo and menus) + sling cam tag */
  .bar{position:absolute;left:0;right:0;height:11%;background:#000;transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:3}
  .bar.t{top:0;transform:translateY(-100%)} .bar.b{bottom:0;transform:translateY(100%)}
  .cine .bar,.menu-on .bar{transform:none}
  #tag{position:absolute;top:calc(11% + 12px);left:14px;font:700 13px var(--ui);letter-spacing:.18em;color:#fff;display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .2s;z-index:4}
  #tag i{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:blink 1s steps(2) infinite}
  .cine #tag{opacity:1}
  @keyframes blink{50%{opacity:.15}}

  /* hud: icons and numbers, nothing to read */
  #cross{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);transition:opacity .2s}
  .cine #cross,.cine .touch,.cine #prompt,.cine #satchel,.cine #tool,.cine #notices,.cine #map,.cine #loot,.cine .ib,.cine #bossbar{opacity:0;pointer-events:none}
  .menu-on #cross,.menu-on #prompt,.menu-on #loot,.menu-on #notices,.menu-on .ib,.menu-on .touch{opacity:0;pointer-events:none}
  .title-on #hearts,.title-on #score,.title-on #coins,.title-on #feed,.title-on #map,.title-on #cards,.title-on #tool,.title-on #cross,.title-on #bossbar,.title-on #labels,.title-on #loot,.title-on #notices,.title-on #callouts{opacity:0}
  #prompt{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font:400 19px/1 var(--display);letter-spacing:.07em;white-space:nowrap;text-shadow:var(--outline)}
  #prompt .pbar{width:92px;height:4px;background:rgba(255,255,255,.18);overflow:hidden}
  #prompt .pbar i{display:block;height:100%;width:0;background:var(--yell)}
  #prompt.locked{opacity:.5}
  #score{position:absolute;top:12px;right:14px;z-index:4}
  #score b{display:block;font:400 30px/1 var(--display);letter-spacing:.02em;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
  .cine #score{top:calc(11% + 10px)}
  #coins{position:absolute;top:48px;right:14px;z-index:4;display:flex;align-items:center;gap:7px;font:400 21px/1 var(--display);letter-spacing:.03em;color:#FFE38A;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
  #coins.bump{animation:cbump .3s ease-out}
  @keyframes cbump{40%{transform:scale(1.3)}}
  .cine #coins{top:calc(11% + 46px)}
  /* the goblin arcade: tickets under the coins, the cabinet's screen laid over the frozen room, a scoreboard, the prize counter */
  #tix{position:absolute;top:80px;right:14px;z-index:4;display:flex;align-items:center;gap:7px;font:400 21px/1 var(--display);letter-spacing:.03em;color:#FFB070;text-shadow:var(--outline);font-variant-numeric:tabular-nums}
  #tix.bump{animation:bump .3s}
  i.tkt{display:inline-block;width:20px;height:13px;background:#FF8A2A;border-radius:2px;box-shadow:inset 0 0 0 2px #FFB070,inset 0 0 0 3px #FF8A2A;vertical-align:middle}
  #arcScreen{position:absolute;left:0;top:0;width:192px;height:256px;transform-origin:0 0;image-rendering:pixelated;z-index:3;touch-action:none}
  #arcHud{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;background:rgba(8,6,10,.78);text-align:center;max-width:calc(100% - 32px);pointer-events:auto}
  #arcHud b{font:400 28px/1 var(--display);letter-spacing:.03em;color:var(--yell)}
  #arcHud span{font:600 14px/1.25 var(--body);letter-spacing:.05em;color:#EDE6F2}
  #arcHud button{font:400 18px/1 var(--display);letter-spacing:.04em;background:#FF3D9A;color:#1A0610;border:0;padding:9px 14px;cursor:pointer}
  #arcBack{position:absolute;left:14px;top:14px;z-index:5;display:flex;align-items:center;gap:8px;font:400 18px/1 var(--display);letter-spacing:.04em;color:#EDE6F2;background:rgba(8,6,10,.78);border:0;padding:10px 14px;cursor:pointer}
  #arcBack kbd{font:600 11px/1 var(--body);border:1px solid currentColor;border-radius:3px;padding:2px 5px}
  .coarse #arcBack kbd{display:none}
  #arcPrizes{position:absolute;right:14px;top:112px;z-index:5;width:min(320px,calc(100% - 28px));display:flex;flex-direction:column;gap:8px;padding:14px;background:rgba(8,6,10,.88)}
  #arcPrizes>b{font:400 24px/1 var(--display);color:var(--yell);letter-spacing:.03em}
  #arcWallet{font:400 18px/1 var(--display);color:#EDE6F2;display:flex;align-items:center;gap:6px}
  #arcPrizeList{display:flex;flex-direction:column;gap:6px}
  .arcPrize{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;background:#1E1824;border:1px solid #3A3046;color:#EDE6F2;text-align:left;cursor:pointer;font:inherit}
  .arcPrize b{font:400 18px/1.05 var(--display);letter-spacing:.03em} .arcPrize small{display:block;font:600 11px/1.2 var(--body);letter-spacing:.04em;color:#A99CB6;margin-top:3px}
  .arcPrize em{font:400 18px/1 var(--display);font-style:normal;color:#FFB070;display:flex;align-items:center;gap:5px}
  .arcPrize kbd{font:600 11px/1 var(--body);border:1px solid #3A3046;border-radius:3px;padding:2px 5px;color:#A99CB6}
  .coarse .arcPrize kbd{display:none}
  .arcPrize[disabled]{opacity:.4;cursor:not-allowed} .arcPrize.owned em{visibility:hidden}
  .arcPrize:not([disabled]):hover,.arcPrize.sel{border-color:#FFB070;background:#2A2232}
  .arcading #cross,.arcading #cards,.arcading #satchel,.arcading #tool,.arcading #prompt,.arcading .touch,.arcading #joy,.arcading #map,.arcading #menuBtn,.arcading #invBtn,.arcading #hearts,.arcading #score,.arcading #feed,.arcading #labHud{display:none!important}
  .coin{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF4B0,#FFD23A 45%,#A87A0A);box-shadow:0 0 0 2px #000;flex:none}
  .ptag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;background:#000;padding:4px 9px 3px;font:400 17px/1 var(--display);letter-spacing:.04em;color:#FFE38A;white-space:nowrap;will-change:transform;transform:skewX(-8deg)}
  .ptag.poor{color:#FF6A4D}
  .owned{display:flex;gap:6px;flex-wrap:wrap}
  .owned span{width:40px;height:40px;display:grid;place-items:center;background:#000;border-left:3px solid currentColor}
  .owned svg{width:24px;height:24px}
  #prompt small{font:700 12px/1 var(--ui);letter-spacing:.16em;color:#E8E0D4;text-shadow:0 2px 0 #000}
  #prompt .coin{margin:0 4px 0 2px;vertical-align:-.06em}
  #feed{position:absolute;top:84px;right:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:4}
  .cine #feed{top:calc(11% + 82px)}
  .kf{background:rgba(0,0,0,.78);padding:3px 9px;font:600 15px var(--ui);display:flex;gap:7px;align-items:center;animation:kfin .25s ease-out}
  .kf svg{width:18px;height:18px;color:var(--amber)}
  .kf .you{color:var(--volt)} .kf .how{font:400 15px var(--display);color:var(--yell);letter-spacing:.03em}
  @keyframes kfin{from{transform:translateX(30px);opacity:0}}
  /* short notices: a black slab, a few words, gone in two seconds */
  #notices{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:4;transition:opacity .2s}
  .nt{background:#000;color:#fff;font:400 18px/1 var(--display);letter-spacing:.08em;padding:7px 14px 6px;border-left:5px solid var(--yell);transform:skewX(-10deg);white-space:nowrap;animation:ntin .25s cubic-bezier(.2,.9,.2,1)}
  .nt > span{display:inline-block;transform:skewX(10deg)}
  .nt.bad{border-color:var(--toast)} .nt.good{border-color:var(--rot)}
  .nt em{font:700 12px var(--ui);font-style:normal;letter-spacing:.16em;color:var(--muted);margin-left:9px;vertical-align:2px}
  .nt kbd{margin:0 0 0 9px}
  .nt.out{animation:ntout .3s ease-in forwards}
  @keyframes ntin{from{transform:skewX(-10deg) translateY(10px);opacity:0}}
  @keyframes ntout{to{transform:skewX(-10deg) translateY(6px);opacity:0}}
  /* loot: an icon and a +1, floating up from the ladle */
  #loot{position:absolute;left:16px;bottom:84px;display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none;z-index:4}
  .lt{display:flex;align-items:center;gap:6px;font:400 20px/1 var(--display);letter-spacing:.04em;color:#fff;text-shadow:var(--outline);animation:ltin .3s cubic-bezier(.2,.9,.2,1) both}
  .lt svg{width:24px;height:24px;display:block;filter:drop-shadow(0 2px 0 #000)}
  .lt.rot{color:var(--rot)}
  .lt.out{animation:ltout .4s ease-in forwards}
  @keyframes ltin{from{transform:translateX(-24px) scale(1.4);opacity:0}}
  @keyframes ltout{to{transform:translateY(-14px);opacity:0}}
  .hpop{position:absolute;left:50%;top:40px;font:400 20px var(--display);color:#7CFF8A;text-shadow:var(--outline);animation:hpop 1.2s ease-out forwards;pointer-events:none}
  @keyframes hpop{0%{transform:translate(-50%,6px);opacity:0}20%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
  /* icon buttons, only when there's no locked mouse to use the keys with */
  .ib{position:absolute;top:12px;width:40px;height:40px;display:grid;place-items:center;padding:0;background:#000;border:0;color:#fff;cursor:pointer;z-index:4;transform:skewX(-8deg)}
  .ib svg{width:20px;height:20px;transform:skewX(8deg)}
  .ib:hover,.ib:focus-visible{background:var(--yell);color:#000;outline:none}
  #menuBtn{left:14px} #invBtn{left:58px}
  #tool{position:absolute;right:14px;bottom:14px;background:#000;padding:7px 11px;display:flex;align-items:center;gap:9px;transition:opacity .2s;transform:skewX(-8deg)}
  #tool > *{transform:skewX(8deg)}
  #tool svg{width:22px;height:22px;display:block}
  #tool kbd{margin:0}
  #tool .tank{width:64px;height:6px;background:#2A2430;overflow:hidden}
  #tool .tank i{display:block;height:100%;width:0;background:var(--volt)}
  .touch{position:absolute;z-index:4;border:3px solid var(--yell);color:#fff;font:400 16px/1 var(--display);letter-spacing:.04em;background:rgba(0,0,0,.82);cursor:pointer;touch-action:none}
  .touch:active{background:var(--yell);color:#000}
  #slingBtn{right:16px;bottom:62px;width:96px;height:96px;border-radius:50%}
  #actBtn{right:124px;bottom:72px;width:76px;height:76px;border-radius:50%;font-size:14px}
  #swapBtn{right:24px;bottom:172px;padding:8px 12px;font-size:14px}
  #hagBtn{right:120px;bottom:166px;padding:8px 12px;font-size:14px}
  #bonkBtn{right:212px;bottom:76px;width:68px;height:68px;border-radius:50%;font-size:15px}
  #joy{position:absolute;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);pointer-events:none;display:none}
  #joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--yell);box-shadow:0 0 0 3px #000}
  #joy span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;font:700 11px var(--ui);letter-spacing:.18em;color:var(--muted);white-space:nowrap}
  #joy.on{display:block} #joy.on span{display:none}
  #joy.ghost{display:block;left:96px;top:auto;bottom:150px;margin:0 0 -56px -56px;opacity:.55}
  .menu-on #joy,.cine #joy{display:none}
  #labHud{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;text-align:center}
  #labHud b{font:400 18px/1 var(--display);letter-spacing:.06em;background:#F2C81E;color:#111;padding:5px 12px 4px;transform:skewX(-10deg)}
  #labHud b em{font-style:normal;opacity:.6;margin-left:6px}
  #labHud span{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;max-width:min(780px,92vw);font:700 12px var(--ui);letter-spacing:.12em;color:#fff;text-shadow:0 1px 0 #000,0 0 4px #000}
  #labHud i{font-style:normal;display:inline-flex;align-items:center} #labHud i.on{color:var(--yell)}
  #labHud small{font:700 11px var(--ui);letter-spacing:.16em;color:#D8DCE2;text-shadow:0 1px 0 #000}
  .menu-on #labHud,.cine #labHud{display:none}
  #ui.scr-lab .ui-in{padding-top:6vh;gap:10px;display:grid;grid-template-columns:auto minmax(0,auto);column-gap:36px;align-items:start}
  #ui.scr-lab .ui-in > .kicker{grid-column:1 / -1;justify-self:start}
  #ui.scr-lab .ui-in > .mlist{grid-column:2;grid-row:2;min-width:min(420px,100%)}
  #ui.scr-lab .mi{font-size:clamp(22px,2.6vw,34px)}
  #ui.scr-lab .ui-in > div:not(.kicker):not(.mlist){max-width:min(460px,40vw)}
  @media (max-width:759px){#ui.scr-lab .ui-in{display:flex}#ui.scr-lab .ui-in > div:not(.kicker):not(.mlist){max-width:none}}
  .labcard{background:#E8E8EC;color:#111;padding:12px 16px;border-left:6px solid #B01818;max-width:min(460px,80vw);display:flex;flex-direction:column;gap:5px}
  .labcard b{font:400 28px/1 var(--display);letter-spacing:.04em}
  .labcard span{font:700 12px var(--ui);letter-spacing:.18em}
  .labcard em{font-style:normal} .c-keter{color:#B01818} .c-euclid{color:#C87A10} .c-safe{color:#2A8A3A}
  .labcard p{margin:0;font-size:14px;line-height:1.35} .labcard .lk{font:700 12px var(--ui);letter-spacing:.12em;color:#3A3E46}
  @media (max-width:560px){#bonkBtn{right:126px;bottom:160px}#hagBtn{right:24px;bottom:268px}} /* phones: keep the left side clear for the move stick */
  #prompt .hg{font-style:normal;color:var(--yell);margin-left:14px}
  #prompt .hg kbd{margin-right:5px}
  /* boss health: one bar along the bottom, TBOI style */
  #bossbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,56%);z-index:4;pointer-events:none;transition:opacity .2s}
  #bossbar b{display:block;font:400 16px/1 var(--display);letter-spacing:.12em;color:#FF6A4D;text-shadow:var(--outline);margin-bottom:6px;text-align:center}
  #bossbar .bb{height:10px;background:#000;border:2px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.14);transform:skewX(-12deg)}
  #bossbar .bb i{display:block;height:100%;width:100%;background:linear-gradient(#FF6A4D,#C8180A);transition:width .25s}

  /* satchel strip + pot cards */
  #satchel{position:absolute;left:14px;bottom:122px;display:flex;gap:4px;z-index:4;transition:opacity .2s}
  .sk{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(10,8,13,.72);padding:4px 5px 3px;min-width:30px}
  .sk svg{width:18px;height:18px;color:var(--c)}
  .sk b{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums}
  .sk .off{position:absolute;top:-7px;right:-5px;font:700 10px/1 var(--ui);background:var(--rot);color:#000;padding:2px 4px}
  .sk.none{opacity:.35}
  #cards{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;transform-origin:left bottom;transition:transform .3s cubic-bezier(.2,.8,.2,1),bottom .3s;z-index:4}
  .cine #cards{bottom:calc(11% + 16px);transform:scale(1.22)}
  .card{--c:#fff;width:54px;height:54px;box-sizing:border-box;background:#000;border:2px solid #2E2834;display:grid;place-items:center;position:relative;transition:transform .14s,border-color .14s,box-shadow .14s,opacity .3s}
  .card svg{width:28px;height:28px;color:var(--c)}
  .card .w{position:absolute;left:50%;top:-30px;transform:translateX(-50%) scale(.6);opacity:0;font:400 19px var(--display);color:#fff;text-shadow:var(--outline);white-space:nowrap;transition:transform .15s cubic-bezier(.3,1.8,.5,1),opacity .15s}
  .card.fire{transform:translateY(-8px) scale(1.14);border-color:var(--c);box-shadow:0 0 22px var(--c),inset 0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
  .card.fire .w,.card.done .w{opacity:1;transform:translateX(-50%) scale(1)}
  .card.done{opacity:.6}
  .card.t2 .w{color:var(--yell)} .card.t3 .w{color:var(--toast)}
  .card.off{background:#141A0C;border-color:#56702A}
  .card.off::after{content:"";position:absolute;top:-5px;right:-5px;width:9px;height:9px;background:var(--rot);border:2px solid #000}
  .card.boil{border-style:dashed}
  .card .q{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:400 26px var(--display);color:var(--rot);background:#11160B;text-shadow:2px 0 #FF2E6E,-2px 0 #00E5FF}
  .card.glitch .q{display:flex;animation:glitch .09s steps(2) infinite}
  .card.glitch{border-color:var(--rot);box-shadow:0 0 22px var(--rot);transform:translateY(-8px) scale(1.14)}
  .card.glitch .w{opacity:0}
  .card.rotw .w{color:var(--rot)}
  @keyframes glitch{0%{clip-path:inset(0 0 55% 0);transform:translateX(-3px)}50%{clip-path:inset(40% 0 0 0);transform:translateX(3px)}100%{clip-path:inset(10% 0 20% 0);transform:none}}
  .potg{width:46px;height:46px;margin-left:8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
  .potg svg{width:100%;height:100%;display:block}
  .spare{display:flex;align-items:center;gap:3px;margin-left:10px;padding:4px 6px;background:rgba(0,0,0,.7);opacity:.8}
  .spare i{display:block;width:18px;height:18px}
  .spare i svg{width:100%;height:100%}
  .spare kbd{margin:0 0 0 4px}
  #cards.swap{animation:cswap .3s ease-out}
  @keyframes cswap{40%{transform:translateY(6px) scale(.94);opacity:.5}}
  .link{width:10px;height:3px;background:#2E2834;transition:background .15s,box-shadow .15s,height .15s}
  .link.on{background:var(--volt);height:5px;box-shadow:0 0 12px var(--volt)}

  /* callouts */
  .co{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);color:#fff;text-shadow:var(--outline);will-change:transform,opacity}
  .co.c1{font-size:clamp(30px,4.2vw,50px);text-transform:lowercase;animation:co1 1.15s ease-out forwards}
  @keyframes co1{0%{transform:translate(-50%,-50%) scale(.4) rotate(-8deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.18) rotate(-4deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(-4deg);opacity:0}}
  /* the flavour rail: callouts land on the right, and a repeat bumps a counter instead of stacking up */
  #flav{position:absolute;right:16px;top:max(30%,220px);display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:48%}
  .cine #flav{top:max(36%,calc(11% + 214px))}
  #rail{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .rl{position:relative;font-family:var(--display);line-height:1.02;color:#fff;text-shadow:var(--outline);white-space:nowrap;transform-origin:100% 50%;animation:rlin .32s cubic-bezier(.2,.9,.2,1) both}
  .rl .w{display:inline-block;transform:rotate(-3deg)}

  @keyframes rlin{0%{transform:translateX(70px) scale(1.5);opacity:0}55%{transform:translateX(-6px) scale(.97);opacity:1}100%{transform:none;opacity:1}}

  .stamp{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) rotate(8deg);font:400 clamp(16px,2.2vw,24px) var(--display);letter-spacing:.12em;color:#fff;background:#E5243B;border:3px solid #000;padding:4px 12px;box-shadow:0 4px 0 #000;animation:stamp 2s ease-out forwards;white-space:nowrap}

  /* brewing station */

    background:radial-gradient(ellipse at 24% 62%,rgba(255,140,50,.2),transparent 50%),linear-gradient(#1b130e,#0d0907)}

  .station{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px;background:rgba(0,0,0,.32)}

  @keyframes potshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

  .cauldron .bubbles circle:nth-child(2){animation-delay:.5s}.cauldron .bubbles circle:nth-child(3){animation-delay:.9s}.cauldron .bubbles circle:nth-child(4){animation-delay:1.3s}

  .chip.atk{background:#FF3B30;color:#fff}

  /* the guide: a spellbook in the title screen's corner, and the parchment spread it opens to */

async function onImpact(point, hitE, items, color, hitS) {

    puff(point.clone().setY(0.6), 0xF2F2F2, 8, 1.2, 0.8, 1.6, 0.25, 0.6);
    const hit = hitE && !hitE.dead ? hitE : targets.slice().sort((a, b) => Math.hypot(a.pos.x - point.x, a.pos.z - point.z) - Math.hypot(b.pos.x - point.x, b.pos.z - point.z))[0];

/* ================= the water gun: sprays straight from the pot, and does its work the longer it's on them ================= */
const GUN_SECS = 6; // a full pot lasts this long through the gun
const gun = { firing: false, acc: 0, mode: 'spray', key: null, announced: false, arcT: 0, useT: 0 };
let gunBigT = 0;
const drops = [], dropGeo = new THREE.SphereGeometry(0.045, 6, 4);
let dropMat = new THREE.MeshBasicMaterial({ color: 0x8FD3FF, transparent: true, opacity: 0.85 });
// two-ingredient pairs that turn the gun into something else entirely
const gunMode = items => { const k = new Set(items.map(i => i.kind)); return k.has('feather') && k.has('doom') ? 'flame' : k.has('bog') && k.has('horn') ? 'arc' : 'spray'; };
function syncGun() {
  const items = brewItems(), key = items.map(i => i.id).join(',');
  if (key === gun.key) return; gun.key = key; gun.mode = gunMode(items); gun.announced = false;
  const flame = gun.mode === 'flame', c = flame ? new THREE.Color(0xFF8A2A) : mixColor(items), old = dropMat; setTimeout(() => old.dispose(), 2500);
  dropMat = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: flame ? 0.75 : 0.85, blending: flame ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !flame });
  tankFillMat.color.copy(c); tankFillMat.emissive.copy(c).multiplyScalar(0.5);
}
function startFire() { if (tool !== 'gun' || busy()) return; gun.firing = true; sprayOn(); }
function stopFire() { gun.firing = false; sprayOff(); }
function updateGun(rdt, sdt) {
  syncGun();
  if (gun.firing && tool === 'gun' && !busy()) {
    const items = brewItems();
    if (items.length) {
      batch.fill = Math.max(0, batch.fill - rdt / GUN_SECS);
      if ((gun.useT += rdt) >= 1) { gun.useT = 0; noteUse(items); }
      if (batch.fill <= 0.001) { batch.fill = 0; outOfBrew(); syncGun(); }
    } else if ((gun.useT += rdt) >= 1) { gun.useT = 0; noteUse([]); }
    if (!gun.announced && gun.mode !== 'spray') { // the first squeeze of a gun combo gets its moment
      gun.announced = true; const C = gun.mode === 'flame' ? 'flamer' : 'arc';
      if (markFound({ combo: C })) setTimeout(() => stamp('NEW COMBO'), 300);
      callout(COMBOS[C].name, 3, { sub: 'GUN COMBO' }); xp(300, 'COMBO'); SFX.wub();
    }
    if (gun.mode === 'arc') { if ((gun.arcT -= rdt) <= 0) { gun.arcT = 0.45; arcTick(); } }
    else {
      gun.acc += rdt * 46;
      const { dir, right } = aimBasis(), tip = new THREE.Vector3(), flame = gun.mode === 'flame'; gunVM.tip.getWorldPosition(tip);
      while (gun.acc >= 1) {
        gun.acc -= 1;
        const m = meshOf(dropGeo, dropMat); m.position.copy(tip); scene.add(m);
        const v = flame ? dir.clone().multiplyScalar(rand(9, 11)).addScaledVector(right, rand(-1.1, 1.1)).add(new THREE.Vector3(0, rand(-0.4, 0.6), 0))
          : dir.clone().multiplyScalar(rand(15, 18)).addScaledVector(right, rand(-0.5, 0.5)).add(new THREE.Vector3(rand(-0.3, 0.3), rand(0.4, 1.0), 0));
        drops.push({ m, pos: tip.clone(), vel: v, t: 0, flame });
      }
    }
  } else gun.acc = 0;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += sdt;
    if (d.flame) { d.vel.y += 2.5 * sdt; d.vel.multiplyScalar(Math.exp(-1.5 * sdt)); d.m.scale.setScalar(1 + d.t * 9); } else d.vel.y -= 7 * sdt;
    d.pos.addScaledVector(d.vel, sdt); d.m.position.copy(d.pos);
    const hit = d.t > 0.02 ? collide(d.pos, d.flame ? 0.2 : 0.08) : null;
    if (hit || d.t > (d.flame ? 0.55 : 2)) {
      if (hit && hit.hitE) gunHit(hit.hitE, d.flame);
      else if (hit && hit.hitS) shroomStruck(hit.hitS);
      else if (hit && Math.random() < 0.25) burst(d.pos, dropMat.color.getHex(), 2, 1.2, 0.3, 0.04, d.flame ? -2 : 6, d.flame);
      scene.remove(d.m); drops.splice(i, 1);

// every drop that lands adds to how long the stream's been on them; enough of it, and the brew takes effect
function gunHit(e, flame) {
  if (e.dead) return;
  const per = flame ? 0.3 : brewItems().length ? 0.6 : 1.2; // boiling water through the gun is slow going
  e.gunExp = (e.gunExp || 0) + 1 / 46 / per;

  if (flame) torch(e); else dose(e);
  dmgSrc = 'ladle';
}
function torch(e) {
  if (imm(e, 'doom')) { showResisted({ resisted: [e] }); return; }
  if (e.wet > 0) { e.wet = 0; puff(centerOf(e), 0xF2F2F2, 4, 1, 0.3, 1.5, 0.2, 0.6); } else e.fire = 3; // it dries them off first, then they catch
  hurt(e, 1, 'TORCHED', centerOf(e), 'doom');
}
function arcTick() {
  const { dir, eye } = aimBasis(), tip = new THREE.Vector3(); gunVM.tip.getWorldPosition(tip);
  let best = null, bd = 9.5;
  for (const e of alive()) { const to = centerOf(e).sub(eye), d = to.length(); if (d < bd && to.normalize().dot(dir) > 0.94) { bd = d; best = e; } }
  if (!best) { bolt(tip, eye.clone().addScaledVector(dir, 5), { life: 0.12, width: 0.02, segs: 6 }); SFX.zap(false); return; }
  dmgSrc = 'gun';
  bolt(tip, centerOf(best), { life: 0.18, width: 0.03 });
  const wet = best.wet > 0; hurt(best, wet ? 2 : 1, wet ? 'SHOCKING' : 'ARC', centerOf(best), 'horn');
  let nx = null, nd = 3.5; for (const o of alive()) { if (o === best) continue; const d = o.pos.distanceTo(best.pos); if (d < nd) { nd = d; nx = o; } }
  if (nx) { bolt(centerOf(best), centerOf(nx), { life: 0.18, width: 0.025 }); hurt(nx, 1, 'ARC', centerOf(best), 'horn'); }
  dmgSrc = 'ladle'; SFX.zap(false);
}
function dose(e) {
  const items = brewItems();
  if (!items.length) { if (imm(e, 'boil')) { showResisted({ resisted: [e] }); return; } damage(e, 1, 'SCALDED', centerOf(e)); return; }
  const plan = planBrew(items, [e], centerOf(e), { gun: true }); let t = 0;
  for (const b of plan) {
    b.str *= 0.6; // the gun doses gently; it's the ladle that hits hard
    setTimeout(() => {
      if (reelOn) return;
      dmgSrc = 'gun'; const p = centerOf(e);
      if (b.tier === 3 && !rec) { startRec('gun'); setTimeout(stopRec, 2600); }
      applyBeat(b, p, [e]);
      if (b.tier === 3) {
        markFound(b) && setTimeout(() => stamp('NEW COMBO'), 300);
        callout(b.word, 3); xp(500, 'COMBO');
        // spraying a crowd lands a lot of these at once: the airhorn and slow-mo play once, the rail counts the rest
        if (performance.now() - gunBigT > 2500) { gunBigT = performance.now(); flash(0.8, 400); shake = 0.45; SFX.airhorn(); SFX.wub(); setTS(0.12, 100); setTimeout(() => setTS(1, 5), 420); }
        else { shake = Math.max(shake, 0.15); SFX.zap(true); }
      } else if (b.tier === 2) {
        if (markFound(b)) setTimeout(() => stamp('NEW COMBO'), 300);
        callout(b.word, 2, { sub: 'COMBO' }); xp(250, 'COMBO');
      } else callout(b.word, 1);
      if (b.extra) { const r = applyExtra(b); callout(r.any ? 'WAIT WHAT' : 'fizzled', r.any ? 2 : 1, { rot: true }); }
      dmgSrc = 'ladle';
    }, t);
    t += b.extra ? 320 : 170;
  }
}

    const chips = [e.wet > 0 && '<span class="chip wet">wet</span>', e.lev > 0 && '<span class="chip float">float</span>', e.glow > 0 && '<span class="chip glow">glow</span>', e.glass && '<span class="chip glass">glass</span>', e.stun > 0 && '<span class="chip daze">dazed</span>', e.frozen > 0 && '<span class="chip ice">ice</span>', e.fire > 0 && '<span class="chip burn">fire</span>', e.chill > 0 && !(e.frozen > 0) && '<span class="chip cold">cold</span>', e.atk > 0 && '<span class="chip atk">!</span>', e.T.immune && `<span class="chip imm">${svg(e.T.immune[0])}</span>`].filter(Boolean).join('');
    const html = (e.T.boss ? '' : `<div class="pips">${Array.from({ length: e.maxHp }, (_, i) => `<i class="pip ${i < e.hp ? '' : 'e'}"></i>`).join('')}</div>`) + (chips ? `<div class="chips">${chips}</div>` : '') + '<i class="arrow"></i>'; // bosses get the bar at the bottom instead
    if (e.html !== html) { e.label.innerHTML = html; e.html = html; }
    e.label.classList.toggle('tgt', e.tgt);
    e.label.style.display = s.behind || menuOpen ? 'none' : '';
    e.label.style.transform = `translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;
  }
  for (const sl of shopSlots) { // price tags under each pedestal
    const p = project(sl.pos.clone().setY(0.98 + sl.ped.position.y)), hide = sl.s.sold || menuOpen || p.behind || sl.ped.position.y < -0.3;
    sl.tag.style.display = hide ? 'none' : ''; if (hide) continue;
    sl.tag.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,0) skewX(-8deg)`; sl.tag.classList.toggle('poor', !canAfford(sl.s));
  }
  $('#hearts').classList.toggle('grace', player.grace > 0);
  const boss = enemies.find(e => e.T.boss && !e.dead && !e.clone);
  if (boss) { if (bossBar.hidden) { bossBar.hidden = false; $('#bossName').textContent = boss.T.name.toUpperCase(); } bossFill.style.width = (100 * boss.hp / boss.maxHp).toFixed(1) + '%'; }
  else if (!bossBar.hidden) bossBar.hidden = true;
  const ma = document.getElementById('mapArrow'); if (ma) ma.style.transform = `translate(-50%,-50%) rotate(${(-player.yaw * 180 / Math.PI).toFixed(1)}deg)`;
  const bk = bonkHold >= 0 ? Math.min(1, bonkHold / BONK_FULL) : 0, pw = $('#power');
  pw.setAttribute('stroke-dasharray', `${(bk > 0 ? bk : wind.on ? wind.power : 0) * 138} 140`);
  pw.setAttribute('stroke', bk >= 1 ? (Math.sin(T * 24) > 0 ? '#FF3B30' : '#FFE14D') : bk >= BONK_HEAVY / BONK_FULL ? '#FF8A2A' : bk > 0 ? '#FFFFFF' : '#FFE14D');
  const pg = document.getElementById('pgFill'); if (pg && batch) { shownFill += (batch.fill - shownFill) * Math.min(1, rdt * 9); pg.setAttribute('y', (14 + 20 * (1 - shownFill)).toFixed(2)); } // the pot gauge sloshes down
  if (shownScore !== score) { shownScore += Math.ceil((score - shownScore) * Math.min(1, rdt * 8)); if (Math.abs(score - shownScore) < 2) shownScore = score; $('#scoreNum').textContent = shownScore.toLocaleString(); }

  requestAnimationFrame(frame);
}

/* ================= boot ================= */
afterBrewChange(); renderTool(); renderHearts();
showUI('title'); camMode = 'title';
{ const f = genFloor(1); floorMap = f.map; enterRoom(f.start, null, true); }
requestAnimationFrame(frame);
})();
